apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-task3-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-task3
  template:
    metadata:
      labels:
        app: nginx-task3
    spec:
      containers:
        - name: nginx-container
          image: nginx:latest
          ports:
            - containerPort: 80